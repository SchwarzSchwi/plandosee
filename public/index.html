<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>플랜두씨 다이어리</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fa;color:#20344a;margin:0}header{background:#193b56;color:white;padding:24px}main{max-width:950px;margin:auto;padding:18px}.card{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #0001}.warn{background:#fff0c9;padding:15px;border-radius:10px}button{cursor:pointer;border:0;border-radius:8px;padding:10px;margin:3px;background:#dce9f2}button.primary{background:#12658c;color:white}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;margin:5px 0 12px;border:1px solid #cbd7e0;border-radius:7px;font:inherit}label{font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{padding:12px;border-bottom:1px solid #eee}.muted{color:#687c8a;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats button{background:#e3f1f7;text-align:left}.stats strong{display:block;font-size:24px}@media(max-width:600px){.grid,.stats{grid-template-columns:1fr}}</style></head><body><header><h1>Plan · Do · See</h1>계획하고 실행하고 돌아보는 다이어리</header><main><div class="warn">지금은 로그인이 없어 링크를 아는 사람은 누구나 볼 수 있습니다. 남이 봐도 괜찮은 내용만 넣으세요</div><nav><button data-tab="plans">계획</button><button data-tab="tasks">할 일</button><button data-tab="logs">실행 기록</button><button data-tab="review">돌아보기</button><button id="export">전체 내보내기</button></nav><div id="app"></div></main><script type="module" src="/app.js"></script></body></html>
